        '503':
          $ref: '#/components/responses/Error503'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ClinicInvitation'
      parameters:
      - name: clinicId
        in: path
        required: true
        schema:
          type: string
      - *id001
      security:
      - BearerJWT: []
      x-roles:
