components:
  securitySchemes:
    BearerJWT:
      type: http
      scheme: bearer
      bearerFormat: JWT
    RefreshCookie:
      type: apiKey
      in: cookie
      name: nss_refresh
  schemas:
    Problem:
      type: object
      properties:
        type: *id004
        title: *id004
        status:
          type: integer
        detail: *id004
        instance: *id004
        code: *id004
        requestId: *id004
        fieldErrors:
          type: array
          items:
            type: object
            properties:
              field: *id004
              message: *id004
            required: []
        retryAfterSeconds:
          type: integer
          minimum: 0
      required:
      - type
      - title
      - status
      - code
      - requestId
    Id: *id006
    GrantSummary:
      type: object
      properties:
        permission: *id004
        scopeType:
          type: string
          nullable: true
        clinicId:
          type: string
          nullable: true
      required:
      - permission
    UserSummary:
      type: object
      properties:
        id: *id006
        displayName: *id004
        email:
          type: string
          format: email
        roles:
          type: array
          items: *id004
        permissions:
          type: array
          items: *id004
        accountVersion:
          type: integer
        active:
          type: boolean
        grants:
          type: array
          items:
            $ref: '#/components/schemas/GrantSummary'
      required:
      - id
      - roles
      - permissions
      - active
      - grants
    AuthLogin:
      type: object
      properties:
        email:
          type: string
          format: email
        password:
          type: string
        replaceExistingSession:
          type: boolean
      required:
      - email
      - password
    AuthResult:
      type: object
      properties:
        accessToken: *id004
        tokenType:
          type: string
          const: Bearer
        expiresIn:
          type: integer
          example: 900
        user:
          $ref: '#/components/schemas/UserSummary'
      required:
      - accessToken
      - tokenType
      - expiresIn
      - user
    StepUpInput:
      type: object
      properties:
        currentPassword: *id004
      required:
      - currentPassword
    StepUpResult:
      type: object
      properties:
        proof: *id004
        expiresInSeconds:
          type: integer
          example: 300
      required:
      - proof
    AccessRequest:
      type: object
      properties:
        name:
          type: string
          minLength: 2
          maxLength: 150
        email:
          type: string
          format: email
        reason:
          type: string
          minLength: 10
          maxLength: 4000
        requestedRole: *id004
        reviewConfirmed:
          type: boolean
        privacyNoticeAcknowledged:
          type: boolean
      required:
      - name
      - email
      - reason
      - requestedRole
      - reviewConfirmed
      - privacyNoticeAcknowledged
    Accepted:
      type: object
      properties:
        accepted:
          type: boolean
        message: *id004
        trackingHint: *id004
      required:
      - accepted
      - message
    ClinicInvitationQueued:
      type: object
      properties:
        accepted:
          type: boolean
        message: *id004
      required:
      - accepted
      - message
    AccessDecision:
      type: object
      properties:
        decision:
          type: string
          enum:
          - APPROVE
          - REJECT
        reason: *id004
        targetRoles:
          type: array
          items: *id004
      required:
      - decision
    AccessRequestStatus:
      type: object
      properties:
        id: *id006
        status:
          type: string
          enum:
          - AWAITING_EMAIL
          - PENDING_REVIEW
          - APPROVED
          - REJECTED
          - EXPIRED
        createdAt:
          type: string
          format: date-time
        emailVerifiedAt:
          type:
          - string
          - 'null'
          format: date-time
      required:
      - id
      - status
    RoleChange:
      type: object
      properties:
        role: *id004
        reason: *id004
        stepUpProof: *id004
      required:
      - role
      - reason
      - stepUpProof
    GrantChange:
      type: object
      properties:
        permission:
          type: string
          enum:
          - map.human.view
          - map.animal.view
        reason: *id004
        clinicId: *id006
      required:
      - permission
      - reason
    Clinic:
      type: object
      properties:
        id: *id006
        name: *id004
        municipalityIbge:
          type: string
          pattern: ^[0-9]{7}$
        status:
          type: string
          enum:
          - ACTIVE
          - INACTIVE
        address: *id004
        version:
          type: integer
      required:
      - id
      - name
      - municipalityIbge
      - status
    ClinicCreate:
      type: object
      properties:
        name:
          type: string
          minLength: 2
        municipalityIbge:
          type: string
          pattern: ^[0-9]{7}$
        postalCode:
          type: string
          pattern: ^[0-9]{8}$
        address: *id004
        cnpj: *id004
        source: *id004
      required:
      - name
      - municipalityIbge
      - source
    ClinicAgentAssign:
      type: object
      properties:
        userId:
          type: integer
        reason: *id004
      required:
      - userId
      - reason
    ClinicInvitation:
      type: object
      properties:
        email:
          type: string
          format: email
        reason: *id004
      required:
      - email
    InvitationAccept:
      type: object
      properties:
        token: *id004
      required:
      - token
    VetNotificationInput:
      type: object
      properties:
        clinicId: *id006
        notificationDate:
          type:
          - string
          - 'null'
          format: date
        speciesCode:
          type: integer
          enum:
          - 0
          - 1
          - 2
        sexCode:
          type: string
          enum:
          - M
          - F
          - i
        castrationCode:
          type: integer
          enum:
          - 0
          - 1
          - 2
        ageValue:
          type:
          - number
          - 'null'
          minimum: 0
        ageUnit:
          type: string
          enum:
          - YEARS
          - MONTHS
          - UNKNOWN
        ageUnknownReason: *id004
        breedName: *id004
        mixedBreed:
          type: boolean
        residenceMunicipalityIbge:
          type: string
          pattern: ^[0-9]{7}$
        residenceTerritoryCode: *id004
        residenceTerritorySource: *id004
        sourceDeclaration:
          type: boolean
      required:
      - clinicId
      - speciesCode
      - sexCode
      - castrationCode
      - ageUnit
      - sourceDeclaration
    VetNotification:
      type: object
      properties:
        id: *id006
        clinicId: *id006
        status:
          type: string
          enum:
          - SUBMITTED
          - UNDER_REVIEW
          - VALIDATED
          - REJECTED
        protocol: *id004
        createdAt:
          type: string
          format: date-time
        dataVersion:
          type: integer
        sourceDataset: *id004
      required:
      - id
      - clinicId
      - status
      - createdAt
    VetCorrection:
      type: object
      properties:
        kind:
          type: string
          enum:
          - RECTIFICATION
          - CANCELLATION
        reason:
