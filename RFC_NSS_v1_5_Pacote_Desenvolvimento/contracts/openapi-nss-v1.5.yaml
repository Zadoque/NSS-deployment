          description: Resultado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Clinic'
        '400':
          $ref: '#/components/responses/Error400'
        '401':
          $ref: '#/components/responses/Error401'
        '403':
          $ref: '#/components/responses/Error403'
        '409':
          $ref: '#/components/responses/Error409'
        '422':
          $ref: '#/components/responses/Error422'
        '503':
          $ref: '#/components/responses/Error503'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ClinicCreate'
      parameters:
      - *id001
      security:
      - BearerJWT: []
      x-roles:
      - CHEFE_GERAL
      - AGENTE_EPIDEMIOLOGICO
    get:
      tags:
      - Clínicas
      summary: Listar clínicas permitidas ao usuário
      operationId: GET_api_v1_clinics
      responses:
        '200':
          description: Resultado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ClinicPage'
        '400':
          $ref: '#/components/responses/Error400'
        '401':
          $ref: '#/components/responses/Error401'
        '403':
          $ref: '#/components/responses/Error403'
        '409':
          $ref: '#/components/responses/Error409'
        '422':
          $ref: '#/components/responses/Error422'
        '503':
          $ref: '#/components/responses/Error503'
      parameters:
      - *id002
      - *id003
      security:
      - BearerJWT: []
      x-roles:
      - CHEFE_GERAL
      - AGENTE_EPIDEMIOLOGICO
      - REPRESENTANTE_CLINICA
  /api/v1/clinics/{clinicId}:
    get:
      tags:
      - Clínicas
      summary: Consultar detalhes da clínica conforme vínculo ativo
      operationId: GET_api_v1_clinics_clinicId
