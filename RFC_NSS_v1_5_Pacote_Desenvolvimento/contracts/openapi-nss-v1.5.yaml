# Gerado a partir de contracts/build_openapi.py — RFC-NSS-001 v1.5
openapi: 3.1.0
info:
  title: NSS/UENF — API contratual consolidada
  version: 1.5.0
  description: Contrato de desenvolvimento proposto pelo RFC-NSS-001 v1.5. Confirme rotas pré-existentes no
    contrato v1 e implemente novas rotas sem quebra retroativa. As operações dependentes de governança não
    estão homologadas para produção.
servers:
- url: https://nss.uenf.br
  description: URL institucional; produção condicionada a release gates
tags:
- name: Autenticação
- name: Identidade
- name: Solicitações
- name: Clínicas
- name: Veterinária
- name: Municípios
- name: Editorial
- name: Portal público
- name: Boletins
- name: Epidemiologia humana
- name: Epidemiologia animal
- name: Institucional
- name: Endereços
- name: Auditoria
paths:
  /api/v1/auth/login:
    post:
      tags:
      - Autenticação
      summary: Efetuar login e criar refresh cookie
      operationId: POST_api_v1_auth_login
      responses:
        '200':
          description: Resultado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthResult'
        '400':
          $ref: '#/components/responses/Error400'
        '401':
          $ref: '#/components/responses/Error401'
        '409':
          $ref: '#/components/responses/Error409'
        '429':
          $ref: '#/components/responses/Error429'
        '503':
          $ref: '#/components/responses/Error503'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AuthLogin'
      security: []
  /api/v1/auth/refresh:
    post:
      tags:
      - Autenticação
      summary: Rotacionar refresh HttpOnly e obter JWT
      operationId: POST_api_v1_auth_refresh
      responses:
        '200':
          description: Resultado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthResult'
        '401':
          $ref: '#/components/responses/Error401'
        '409':
          $ref: '#/components/responses/Error409'
        '429':
          $ref: '#/components/responses/Error429'
        '503':
          $ref: '#/components/responses/Error503'
      security: []
  /api/v1/auth/logout:
    post:
      tags:
      - Autenticação
      summary: Revogar sessão atual e remover cookie
      operationId: POST_api_v1_auth_logout
      responses:
        '204':
          description: Resultado
        '401':
          $ref: '#/components/responses/Error401'
        '503':
          $ref: '#/components/responses/Error503'
      security:
      - BearerJWT: []
  /api/v1/auth/step-up:
    post:
      tags:
      - Autenticação
      summary: Reconfirmar senha para ações críticas por 5 minutos
      operationId: POST_api_v1_auth_step_up
      responses:
        '200':
          description: Resultado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StepUpResult'
        '400':
          $ref: '#/components/responses/Error400'
        '401':
          $ref: '#/components/responses/Error401'
        '403':
          $ref: '#/components/responses/Error403'
        '429':
          $ref: '#/components/responses/Error429'
        '503':
          $ref: '#/components/responses/Error503'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/StepUpInput'
      security:
      - BearerJWT: []
  /api/v1/users/me:
    get:
      tags:
      - Identidade
      summary: Consultar identidade e permissões efetivas
      operationId: GET_api_v1_users_me
      responses:
        '200':
          description: Resultado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserSummary'
        '401':
          $ref: '#/components/responses/Error401'
        '503':
          $ref: '#/components/responses/Error503'
      security:
      - BearerJWT: []
  /api/v1/users/{userId}/roles:
    post:
      tags:
      - Identidade
      summary: Conceder papel após checagem transacional do último chefe
      operationId: POST_api_v1_users_userId_roles
      responses:
        '200':
          description: Resultado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserSummary'
        '400':
          $ref: '#/components/responses/Error400'
        '401':
          $ref: '#/components/responses/Error401'
        '403':
          $ref: '#/components/responses/Error403'
        '409':
          $ref: '#/components/responses/Error409'
        '422':
          $ref: '#/components/responses/Error422'
        '503':
          $ref: '#/components/responses/Error503'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RoleChange'
      parameters:
      - name: userId
        in: path
        required: true
        schema:
          type: integer
      - &id001
        name: Idempotency-Key
        in: header
        required: true
        description: UUID v4. Escopo actor/rota/chave, fingerprint e retenção por 24 h; conflito 409.
        schema:
          type: string
          format: uuid
      security:
      - BearerJWT: []
      x-roles:
      - CHEFE_GERAL
      - ADMINISTRADOR
  /api/v1/users/{userId}/roles/{role}:
    delete:
      tags:
      - Identidade
      summary: Revogar papel com lock, step-up e auditoria
      operationId: DELETE_api_v1_users_userId_roles_role
      responses:
        '200':
          description: Resultado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserSummary'
        '400':
          $ref: '#/components/responses/Error400'
        '401':
          $ref: '#/components/responses/Error401'
        '403':
          $ref: '#/components/responses/Error403'
        '409':
          $ref: '#/components/responses/Error409'
        '422':
          $ref: '#/components/responses/Error422'
        '503':
          $ref: '#/components/responses/Error503'
      parameters:
      - name: userId
        in: path
        required: true
        schema:
          type: integer
      - name: role
        in: path
        required: true
        schema:
          type: string
      - *id001
      - name: X-Step-Up-Proof
        in: header
        required: true
        description: Prova de senha recente, válida por 5 minutos para ações críticas.
        schema:
          type: string
      - name: reason
        in: query
        required: false
        description: Motivo auditável da revogação.
        schema:
          type: string
      security:
      - BearerJWT: []
      x-roles:
      - CHEFE_GERAL
      - ADMINISTRADOR
  /api/v1/users/{userId}/grants:
    post:
      tags:
      - Identidade
      summary: Conceder grant independente de mapa
      operationId: POST_api_v1_users_userId_grants
      responses:
        '200':
          description: Resultado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserSummary'
        '400':
          $ref: '#/components/responses/Error400'
        '401':
          $ref: '#/components/responses/Error401'
        '403':
          $ref: '#/components/responses/Error403'
        '409':
          $ref: '#/components/responses/Error409'
        '422':
          $ref: '#/components/responses/Error422'
        '503':
          $ref: '#/components/responses/Error503'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/GrantChange'
      parameters:
      - name: userId
        in: path
        required: true
        schema:
          type: integer
      - *id001
      security:
      - BearerJWT: []
      x-roles:
      - CHEFE_GERAL
      - ADMINISTRADOR
      - AGENTE_EPIDEMIOLOGICO
  /api/v1/users/{userId}/grants/{permission}:
    delete:
      tags:
      - Identidade
      summary: Revogar grant de mapa no escopo informado
      operationId: DELETE_api_v1_users_userId_grants_permission
      responses:
        '200':
          description: Resultado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserSummary'
        '400':
          $ref: '#/components/responses/Error400'
        '401':
          $ref: '#/components/responses/Error401'
        '403':
          $ref: '#/components/responses/Error403'
        '409':
          $ref: '#/components/responses/Error409'
        '422':
          $ref: '#/components/responses/Error422'
        '503':
          $ref: '#/components/responses/Error503'
      parameters:
      - name: userId
        in: path
        required: true
        schema:
          type: integer
      - name: permission
        in: path
        required: true
        schema:
          type: string
      - *id001
      - name: reason
        in: query
        required: false
        description: Motivo auditável da revogação.
        schema:
          type: string
      - name: clinicId
        in: query
        required: false
        description: UUID da clínica; ausente seleciona apenas o grant global.
        schema:
          type: string
          format: uuid
      security:
      - BearerJWT: []
      x-roles:
      - CHEFE_GERAL
      - ADMINISTRADOR
      - AGENTE_EPIDEMIOLOGICO
  /api/public/access-requests:
    post:
      tags:
      - Solicitações
      summary: Receber pedido após segunda etapa de revisão
      operationId: POST_api_public_access_requests
      responses:
        '202':
          description: Resultado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Accepted'
        '400':
          $ref: '#/components/responses/Error400'
        '409':
          $ref: '#/components/responses/Error409'
        '422':
          $ref: '#/components/responses/Error422'
        '429':
          $ref: '#/components/responses/Error429'
        '503':
          $ref: '#/components/responses/Error503'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AccessRequest'
      parameters:
      - *id001
      security: []
  /api/public/access-requests/verify:
    post:
      tags:
      - Solicitações
      summary: Confirmar e-mail por token único e movê-lo à fila de aprovação
      operationId: POST_api_public_access_requests_verify
      responses:
        '200':
          description: Resultado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Accepted'
        '400':
          $ref: '#/components/responses/Error400'
        '410':
          $ref: '#/components/responses/Error410'
        '429':
          $ref: '#/components/responses/Error429'
        '503':
          $ref: '#/components/responses/Error503'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                token: &id004
                  type: string
              required:
              - token
      security: []
  /api/public/access-requests/status:
    get:
      tags:
      - Solicitações
      summary: Consultar protocolo com segredo separado e prazo
      operationId: GET_api_public_access_requests_status
      responses:
        '200':
          description: Resultado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AccessRequestStatus'
        '400':
          $ref: '#/components/responses/Error400'
        '404':
          $ref: '#/components/responses/Error404'
        '410':
          $ref: '#/components/responses/Error410'
        '429':
          $ref: '#/components/responses/Error429'
        '503':
          $ref: '#/components/responses/Error503'
      parameters:
      - name: protocol
        in: query
        required: true
        description: ''
        schema:
          type: string
      - name: secret
        in: query
        required: true
        description: ''
        schema:
          type: string
      security: []
  /api/v1/access-requests:
    get:
      tags:
      - Solicitações
      summary: Listar solicitações a decidir com escopo administrativo
      operationId: GET_api_v1_access_requests
      responses:
        '200':
          description: Resultado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AccessRequestPage'
        '400':
          $ref: '#/components/responses/Error400'
        '401':
          $ref: '#/components/responses/Error401'
        '403':
          $ref: '#/components/responses/Error403'
        '409':
          $ref: '#/components/responses/Error409'
        '422':
          $ref: '#/components/responses/Error422'
        '503':
          $ref: '#/components/responses/Error503'
      parameters:
      - &id002
        name: page
        in: query
        required: false
        description: Começa em zero.
        schema:
          type: integer
          minimum: 0
      - &id003
        name: size
        in: query
        required: false
        description: Tamanho máximo 20.
        schema:
          type: integer
          minimum: 1
          maximum: 20
      security:
      - BearerJWT: []
      x-roles:
      - CHEFE_GERAL
      - ADMINISTRADOR
  /api/v1/access-requests/{requestId}/decision:
    post:
      tags:
      - Solicitações
      summary: Decidir uma única vez, associar usuário existente e notificar via outbox
      operationId: POST_api_v1_access_requests_requestId_decision
      responses:
