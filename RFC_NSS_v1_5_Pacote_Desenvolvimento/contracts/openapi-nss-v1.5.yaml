          description: Resultado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AccessRequestStatus'
        '400':
          $ref: '#/components/responses/Error400'
        '401':
          $ref: '#/components/responses/Error401'
        '403':
          $ref: '#/components/responses/Error403'
        '409':
          $ref: '#/components/responses/Error409'
        '422':
          $ref: '#/components/responses/Error422'
        '503':
          $ref: '#/components/responses/Error503'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AccessDecision'
      parameters:
      - name: requestId
        in: path
        required: true
        schema:
          type: string
      - *id001
      security:
      - BearerJWT: []
      x-roles:
      - CHEFE_GERAL
      - ADMINISTRADOR
  /api/v1/clinics:
    post:
      tags:
      - Clínicas
      summary: Cadastrar clínica sob gestão do agente ativo
      operationId: POST_api_v1_clinics
      responses:
