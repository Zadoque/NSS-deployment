        '409':
          $ref: '#/components/responses/Error409'
        '422':
          $ref: '#/components/responses/Error422'
        '503':
          $ref: '#/components/responses/Error503'
      parameters:
      - name: clinicId
        in: path
        required: true
        schema:
          type: string
      security:
      - BearerJWT: []
      x-roles:
      - CHEFE_GERAL
      - AGENTE_EPIDEMIOLOGICO
      - REPRESENTANTE_CLINICA
  /api/v1/clinics/{clinicId}/status:
    post:
      tags:
      - Clínicas
      summary: Ativar ou inativar clínica e revogar operações futuras
      operationId: POST_api_v1_clinics_clinicId_status
      responses:
        '200':
          description: Resultado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Clinic'
        '400':
          $ref: '#/components/responses/Error400'
        '401':
          $ref: '#/components/responses/Error401'
        '403':
          $ref: '#/components/responses/Error403'
        '409':
          $ref: '#/components/responses/Error409'
        '422':
          $ref: '#/components/responses/Error422'
        '503':
          $ref: '#/components/responses/Error503'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                status:
                  type: string
                  enum:
                  - ACTIVE
                  - INACTIVE
                reason: *id004
              required:
              - status
              - reason
      parameters:
      - name: clinicId
        in: path
        required: true
        schema:
          type: string
      - &id005
        name: If-Match
        in: header
        required: true
        description: ETag da versão do recurso; divergência 409.
        schema:
          type: string
      - *id001
      security:
      - BearerJWT: []
      x-roles:
      - CHEFE_GERAL
