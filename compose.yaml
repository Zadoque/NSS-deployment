name: nss-v1

services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:?POSTGRES_DB must be set}
      POSTGRES_USER: ${POSTGRES_ADMIN_USER:?POSTGRES_ADMIN_USER must be set}
      POSTGRES_PASSWORD: ${POSTGRES_ADMIN_PASSWORD:?POSTGRES_ADMIN_PASSWORD must be set}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s
    networks: [nss_internal]

  java:
    image: ${NSS_JAVA_IMAGE:-nss-java:local}
    restart: unless-stopped
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://db:5432/${POSTGRES_APP_DB:-${POSTGRES_DB}}
      SPRING_DATASOURCE_USERNAME: ${NSS_APP_RUNTIME_USER}
      SPRING_DATASOURCE_PASSWORD: ${NSS_APP_RUNTIME_PASSWORD}
      ANALYTICS_DATASOURCE_URL: jdbc:postgresql://db:5432/${POSTGRES_DB}
      ANALYTICS_DATASOURCE_USERNAME: ${NSS_ANALYTICS_READER_USER}
      ANALYTICS_DATASOURCE_PASSWORD: ${NSS_ANALYTICS_READER_PASSWORD}
      SPRING_JPA_HIBERNATE_DDL_AUTO: validate
      SPRING_PROFILES_ACTIVE: prod
      JWT_SECRET: ${JWT_SECRET:?JWT_SECRET must be set}
      JWT_EXPIRATION: ${JWT_EXPIRATION:-900000}
      SECURE_COOKIES: ${SECURE_COOKIES:-false}
      API_AUTH_SECURE_COOKIE: ${SECURE_COOKIES:-false}
      REFRESH_EXPIRATION: ${REFRESH_EXPIRATION:-604800000}
      BOOTSTRAP_ADMIN_EMAIL: ${BOOTSTRAP_ADMIN_EMAIL:-}
      BOOTSTRAP_ADMIN_PASSWORD: ${BOOTSTRAP_ADMIN_PASSWORD:-}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-}
      MAIL_HOST: ${MAIL_HOST:-localhost}
      MAIL_PORT: ${MAIL_PORT:-1025}
      MAIL_USERNAME: ${MAIL_USERNAME:-}
      MAIL_PASSWORD: ${MAIL_PASSWORD:-}
      MAIL_FROM: ${MAIL_FROM:-}
      MAIL_SMTP_AUTH: ${MAIL_SMTP_AUTH:-false}
      MAIL_SMTP_STARTTLS: ${MAIL_SMTP_STARTTLS:-false}
      REFRESH_TOKEN_TTL_SECONDS: ${REFRESH_TOKEN_TTL_SECONDS:-604800}
      REFRESH_COOKIE_SECURE: ${REFRESH_COOKIE_SECURE:-true}
      REFRESH_COOKIE_SAME_SITE: ${REFRESH_COOKIE_SAME_SITE:-Strict}
      SPRING_FLYWAY_USER: ${NSS_APP_MIGRATOR_USER}
      SPRING_FLYWAY_PASSWORD: ${NSS_APP_MIGRATOR_PASSWORD}
    depends_on:
      db:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    expose:
      - "8080"
    networks: [nss_internal]

  frontend:
    image: ${NSS_FRONTEND_IMAGE:-nss-frontend:local}
    restart: unless-stopped
    expose:
      - "80"
    networks: [nss_internal]

  db-permissions:
    image: postgres:16-alpine
    entrypoint: ["/scripts/provision-roles.sh"]
    environment:
      POSTGRES_HOST: db
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_APP_DB: ${POSTGRES_APP_DB:-${POSTGRES_DB}}
      POSTGRES_ADMIN_USER: ${POSTGRES_ADMIN_USER}
      POSTGRES_ADMIN_PASSWORD: ${POSTGRES_ADMIN_PASSWORD}
      APP_RUNTIME_USER: ${NSS_APP_RUNTIME_USER}
      APP_RUNTIME_PASSWORD: ${NSS_APP_RUNTIME_PASSWORD}
      APP_MIGRATOR_USER: ${NSS_APP_MIGRATOR_USER}
      APP_MIGRATOR_PASSWORD: ${NSS_APP_MIGRATOR_PASSWORD}
      ANALYTICS_READER_USER: ${NSS_ANALYTICS_READER_USER}
      ANALYTICS_READER_PASSWORD: ${NSS_ANALYTICS_READER_PASSWORD}
      ANALYTICS_WRITER_USER: ${NSS_ANALYTICS_WRITER_USER}
      ANALYTICS_WRITER_PASSWORD: ${NSS_ANALYTICS_WRITER_PASSWORD}
      ANALYTICS_MIGRATOR_USER: ${NSS_ANALYTICS_MIGRATOR_USER:-nss_analytics_migrator}
      ANALYTICS_MIGRATOR_PASSWORD: ${NSS_ANALYTICS_MIGRATOR_PASSWORD:-${POSTGRES_ADMIN_PASSWORD}}
      GRAFANA_DB_USER: ${NSS_GRAFANA_DB_USER:-nss_grafana}
      GRAFANA_DB_PASSWORD: ${NSS_GRAFANA_DB_PASSWORD:-${POSTGRES_ADMIN_PASSWORD}}
    volumes:
      - ./scripts/provision-roles.sh:/scripts/provision-roles.sh:ro
    depends_on:
      db:
        condition: service_healthy
    networks: [nss_internal]

  migrate:
    image: ${NSS_PIPELINE_IMAGE:-nss-pipeline:local}
    entrypoint: ["alembic"]
    command: ["upgrade", "head"]
    environment:
      DATABASE_URL: postgresql+psycopg2://${NSS_ANALYTICS_MIGRATOR_USER:-nss_analytics_migrator}:${NSS_ANALYTICS_MIGRATOR_PASSWORD:-${POSTGRES_ADMIN_PASSWORD}}@db:5432/${POSTGRES_DB}
      GRAFANA_DB_USER: ${NSS_GRAFANA_DB_USER:-nss_grafana}
      GRAFANA_DB_PASSWORD: ${NSS_GRAFANA_DB_PASSWORD:-${POSTGRES_ADMIN_PASSWORD}}
    depends_on:
      db:
        condition: service_healthy
      db-permissions:
        condition: service_completed_successfully
    networks: [nss_internal]

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    ports:
      - "127.0.0.1:${NSS_HTTP_PORT:-8080}:80"
    volumes:
      - ./caddy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - frontend
      - java
    networks: [nss_internal]

  grafana:
    image: ${NSS_GRAFANA_IMAGE:-grafana/grafana:latest}
    restart: unless-stopped
    environment:
      GF_SECURITY_ADMIN_USER: ${GRAFANA_ADMIN_USER:-admin}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:?GRAFANA_ADMIN_PASSWORD must be set}
      GF_USERS_ALLOW_SIGN_UP: "false"
    ports:
      - "127.0.0.1:3000:3000"
    volumes:
      - grafana_data:/var/lib/grafana
      - ./observability/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./observability/grafana/dashboards:/var/lib/grafana/dashboards:ro
    depends_on:
      prometheus:
        condition: service_started
    networks: [nss_internal]

  prometheus:
    image: prom/prometheus:v3.7.2
    restart: unless-stopped
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
    volumes:
      - prometheus_data:/prometheus
      - ./observability/prometheus.yml:/etc/prometheus/prometheus.yml:ro
    ports:
      - "127.0.0.1:9090:9090"
    networks: [nss_internal]

  pushgateway:
    image: prom/pushgateway:v1.11.1
    restart: unless-stopped
    command: ["--persistence.file=/pushgateway/metrics"]
    volumes:
      - pushgateway_data:/pushgateway
    ports:
      - "127.0.0.1:9091:9091"
    networks: [nss_internal]

  pipeline:
    image: ${NSS_PIPELINE_IMAGE:-nss-pipeline:local}
    profiles: ["jobs"]
    entrypoint: ["python", "-m", "app.pipeline.run_load"]
    environment:
      DATABASE_URL: postgresql+psycopg2://${NSS_ANALYTICS_WRITER_USER}:${NSS_ANALYTICS_WRITER_PASSWORD}@db:5432/${POSTGRES_DB}
      PROMETHEUS_PUSHGATEWAY_URL: ${PROMETHEUS_PUSHGATEWAY_URL:-http://pushgateway:9091}
    volumes:
      - pipeline_data:/data
    depends_on:
      db:
        condition: service_healthy
      pushgateway:
        condition: service_started
      migrate:
        condition: service_completed_successfully
    networks: [nss_internal]

networks:
  nss_internal:
    driver: bridge

volumes:
  pgdata:
  pipeline_data:
  grafana_data:
  prometheus_data:
  pushgateway_data:
  caddy_data:
  caddy_config:
