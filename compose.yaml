# Branch de publicação estática: nenhum Java, banco ou job de pipeline.
services:
  frontend:
    image: ${NSS_FRONTEND_IMAGE:-nss-frontend:prod-mock}
    build:
      context: ${NSS_FRONTEND_CONTEXT:-../NSS-front-end}
      dockerfile: Dockerfile.prod-mock
    restart: unless-stopped
    cpus: ${NSS_FRONTEND_CPUS:-0.50}
    mem_limit: ${NSS_FRONTEND_MEMORY_LIMIT:-128m}
    pids_limit: 64
    security_opt: [no-new-privileges:true]
    read_only: true
    tmpfs:
      - /var/cache/nginx:size=32m
      - /var/run:size=1m
      - /tmp:size=16m
    networks: [static_internal]
    healthcheck:
      test: [CMD-SHELL, "wget -q -O - http://127.0.0.1/healthz >/dev/null"]
      interval: 10s
      timeout: 3s
      retries: 5

  caddy:
    image: ${NSS_CADDY_IMAGE:-caddy:2-alpine}
    restart: unless-stopped
    ports:
      - "${NSS_BIND_ADDRESS:-127.0.0.1}:${NSS_HTTP_PORT:-8080}:80"
    volumes:
      - ./caddy/Caddyfile:/etc/caddy/Caddyfile:ro
    tmpfs:
      - /data:size=16m
      - /config:size=16m
      - /tmp:size=16m
    read_only: true
    security_opt: [no-new-privileges:true]
    cpus: ${NSS_CADDY_CPUS:-0.50}
    mem_limit: ${NSS_CADDY_MEMORY_LIMIT:-128m}
    pids_limit: 128
    depends_on:
      frontend:
        condition: service_healthy
    networks: [static_internal, edge]
    healthcheck:
      test: [CMD-SHELL, "wget -q -O - http://127.0.0.1/healthz >/dev/null"]
      interval: 10s
      timeout: 3s
      retries: 5

networks:
  edge:
  static_internal:
    internal: true
